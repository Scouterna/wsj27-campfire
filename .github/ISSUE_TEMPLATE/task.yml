name: Task
description: Track a task or chore, such as setup, configuration, or maintenance
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        For work that is not a feature or a bug – setup, configuration, maintenance, or housekeeping.

  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done, and why?
      placeholder: Update .tool-versions to the next Node LTS, so local machines and CI run the same runtime.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How do we know the task is complete?
      placeholder: |
        - …
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, context, or anything else that helps.
    validations:
      required: false
