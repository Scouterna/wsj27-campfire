name: Bug
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what went wrong and how to reproduce it. The clearer the steps, the faster the fix.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug – what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger it.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who is affected?
      description: Which people does this affect? Choose all that apply.
      multiple: true
      options:
        - Leaders
        - CMT – Administration
        - CMT – Communication
        - CMT – Health
        - CMT – IST support
        - CMT – Program
        - CMT – Unit support
        - CMT – Head of Contingent
        - Developers
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did it happen? Include anything relevant – device, operating system, browser, app or URL, and version.
      placeholder: |
        - Device / OS: …
        - Browser or app: …
        - Version: …
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that helps.
    validations:
      required: false
