name: Feature
description: Track a feature or capability to build for Campfire
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem you are solving, then the shape of the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need or problem does this address, and why now?
      placeholder: Today there is no reliable way to …, so …
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who is this for?
      description: Which people does it serve? Choose all that apply.
      multiple: true
      options:
        - Leaders
        - CMT – Administration
        - CMT – Communication
        - CMT – Health
        - CMT – IST support
        - CMT – Program
        - CMT – Unit support
        - CMT – Head of Contingent
        - Developers
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you build or change? A rough idea is fine.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it is done? List the observable outcomes.
      placeholder: |
        - …
        - …
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Alternatives and notes
      description: Other approaches considered, open questions, links, or anything that may need an architectural decision (ADR).
    validations:
      required: false
