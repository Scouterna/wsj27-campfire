name: Release guidebook

# Builds the guidebook from main and deploys it to GitHub Pages.

on:
  # The paths build_guidebook.yml filters on, with this workflow in place of
  # that one. That workflow filters inside the job because a skipped required
  # check blocks the pull request, and a deploy is not a required check, so
  # here the filter lives on the trigger.
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".agents/agents/**"
      - "config/vitepress/**"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".tool-versions"
      - ".github/workflows/release_guidebook.yml"
  workflow_dispatch:

# Only one deploy at a time, and never cancel one in flight – a half-finished
# deploy would leave the published site in whatever state it got to.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Building only reads the repository. The deploy job asks for the rest.
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the guidebook
        run: pnpm build:guidebook

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to the job that needs it – id-token signs the deployment, and pages
    # publishes it.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
