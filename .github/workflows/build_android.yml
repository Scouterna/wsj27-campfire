name: Build Android

# Assembles the Android shell on every pull request, so a change that does not
# compile fails the pull request rather than someone's emulator.
#
# A debug build, and unsigned: signing keys and store distribution are not part
# of this repository, and proving it compiles is what a build workflow is for.
#
# The Apple shell has no equivalent. Building it needs macOS with Xcode, which
# this project deliberately does not spend a runner on – so `pnpm build:apple:dev`
# on a developer's machine is the whole gate there.
#
# Filtered inside the job rather than by `on: paths:`. A workflow skipped by a
# path filter reports no status, and a required check waits on that status
# forever; a skipped job reports as passing.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# One run per pull request. Pushing again cancels the run it superseded, so a
# branch pushed three times in a minute costs one run, not three.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Look for Android changes
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Listed in its own step, so a failed API call fails the job rather
          # than reading as "nothing changed" and skipping the build. The files
          # endpoint rather than `gh pr diff`, which refuses a pull request of
          # more than 300 files; this one pages through up to 3,000.
          files="$(gh api --paginate \
                     "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
                     --jq '.[].filename')"

          if printf '%s\n' "$files" \
             | grep -qE '^(apps/android/|\.github/workflows/build_android\.yml$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "No Android changes in this pull request."
          fi

      - name: Check out the repository
        if: steps.changed.outputs.android == 'true'
        uses: actions/checkout@v7

      # The version gradle/gradle-daemon-jvm.properties pins the daemon to. The
      # wrapper's launcher needs a JVM before it can read that file, so the two
      # have to agree.
      - name: Set up the JDK
        if: steps.changed.outputs.android == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: steps.changed.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: apps/android

      - name: Assemble the Android shell
        if: steps.changed.outputs.android == 'true'
        working-directory: apps/android
        run: ./gradlew assembleLocalDebug
