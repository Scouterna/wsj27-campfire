name: Build web

# Builds the web application on every pull request, so a change that does not
# compile or bundle fails the pull request rather than a deploy – and the image,
# without publishing it, when the files it is made from changed, so a broken
# Dockerfile fails here rather than in release_web.yml after the merge.
#
# Filtered inside the job rather than by `on: paths:`. A workflow skipped by a
# path filter reports no status, and a required check waits on that status
# forever; a skipped job reports as passing.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# One run per pull request. Pushing again cancels the run it superseded, so a
# branch pushed three times in a minute costs one run, not three.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Room for the image build, which installs and builds the workspace a second
    # time inside Docker – the same ceiling as release_web.yml.
    timeout-minutes: 20
    steps:
      # Everything the bundle is made from: the app, the modules it composes,
      # the libraries they stand on, the Vite, Storybook, and TypeScript
      # configuration, the Dockerfile, the image's Caddyfile, and what the image
      # leaves out, the lockfile, the Node version the runner installs, the
      # workspace's install policy, and this workflow.
      #
      # The image files also answer a second question – whether to build the
      # image at all. It is the slow step, and a change to the bundle alone is
      # already proven by the two builds before it.
      - name: Look for web changes
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Listed in its own step, so a failed API call fails the job rather
          # than reading as "nothing changed" and skipping the build. The files
          # endpoint rather than `gh pr diff`, which refuses a pull request of
          # more than 300 files; this one pages through up to 3,000.
          files="$(gh api --paginate \
                     "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
                     --jq '.[].filename')"

          if printf '%s\n' "$files" \
             | grep -qE '^(apps/web/|modules/|libraries/|config/vite/|config/storybook/|config/environments/prod/Dockerfile$|config/environments/prod/image\.Caddyfile$|\.dockerignore$|tsconfig\.json$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.tool-versions$|\.github/workflows/build_web\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "No web changes in this pull request."
          fi

          if printf '%s\n' "$files" \
             | grep -qE '^(config/environments/prod/Dockerfile$|config/environments/prod/image\.Caddyfile$|\.dockerignore$|\.github/workflows/build_web\.yml$)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.changed.outputs.web == 'true'
        uses: actions/checkout@v7

      - name: Set up pnpm
        if: steps.changed.outputs.web == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.changed.outputs.web == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        if: steps.changed.outputs.web == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the web application
        if: steps.changed.outputs.web == 'true'
        run: pnpm build:web

      # Every story is compiled here, so a component whose story no longer
      # builds fails the pull request rather than the next person who opens
      # Storybook. It is a build, not a render: a story that bundles and then
      # throws on screen still passes.
      - name: Build Storybook
        if: steps.changed.outputs.web == 'true'
        run: pnpm build:storybook

      - name: Set up Buildx
        if: steps.changed.outputs.image == 'true'
        uses: docker/setup-buildx-action@v3

      # The same build release_web.yml runs, stopped short of the registry. It
      # reads the cache the releases on main write, so the install layer is
      # reused, and writes none of its own – a pull request's layers are not
      # worth keeping.
      - name: Build the image
        if: steps.changed.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: config/environments/prod/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
