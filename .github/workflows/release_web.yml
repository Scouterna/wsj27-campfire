name: Release web

# Packages the web application as a container image and publishes it to the GitHub
# Container Registry, so a deployment has something to pull.
#
# The version is worked out from the commits since the last web-v<version> tag, by the
# rule in the Versioning section of AGENTS.md (ADR 034). A merge that earns a version
# publishes :<version>, creates the tag web-v<version>, and then moves :dev to that
# image, so dev follows every version and only ever a version that finished releasing
# (ADR 035).
#
# Moving :dev is a job of its own in the dev environment, so every move is a deployment
# linking to the site dev serves, and a merge that earns no version records none.
#
# Every merge also publishes :main and :sha-<short>, whether or not it earned a version.
# Those are for rollback and for pointing a staging deployment at a specific commit;
# the version tags are what a real deployment pins. :prod moves only through
# promote_web.yml.
#
# Nothing here deploys. Moving a tag restarts nothing, and how the cluster notices a
# moved tag is settled with the people who run it.
#
# Also runnable by hand, to retry a release that failed. A retry runs every step again,
# and because the failed run created no tag, it works out the same version and
# overwrites whatever :<version> the failed run left behind.

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "modules/**"
      - "libraries/**"
      - "config/vite/**"
      - "config/environments/prod/Dockerfile"
      - "config/environments/prod/image.Caddyfile"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".tool-versions"
      - ".dockerignore"
      - ".github/workflows/release_web.yml"
  workflow_dispatch:

# Releases queue rather than race, because two merges in quick succession would
# otherwise create the same tag twice. One in flight is never canceled, because a
# canceled release can leave a tag without its image, or an image without its tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    # An amd64 runner, because the image is built for amd64 and only for amd64 – the
    # cluster's platform (ADR 026). The Dockerfile's build stage runs on the runner's own
    # platform whatever the target, so nothing here runs under emulation either way.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Scoped to the job that needs it – packages to publish the image, contents to create
    # the version tag.
    permissions:
      contents: write
      packages: write
    # What the dev job needs to move :dev, and to say how to move it by hand.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.version.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history and every tag, because a shallow clone answers as though
      # nothing was ever released.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node alone runs next-version.ts – it reads nothing but git and this workflow,
      # so there is nothing to install.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Work out the version and the tags
        id: version
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The next version, or nothing when these commits earn none.
          version="$(node scripts/release/next-version.ts web)"

          # A registry path is lowercase; a GitHub owner is not necessarily.
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # Always published, version or not – a moving pointer at main, and an
          # immutable one at this exact commit.
          tags="${image}:main
          ${image}:sha-$(printf '%s' "$SHA" | cut -c1-7)"

          if [ -n "$version" ]; then
            echo "These commits earn version $version."
            tags="${tags}
          ${image}:${version}"
          else
            echo "These commits earn no version – publishing main and sha tags only."
          fi

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags<<EOF"
            printf '%s\n' "$tags" | sed 's/^[[:space:]]*//'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The install layer is the expensive one, and the Dockerfile is laid out so a
      # source change reuses it. The cache carries that across runs, where a runner
      # starts with nothing. An empty version is passed as empty, and the build reads
      # it as 0.0.0.
      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: config/environments/prod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            CAMPFIRE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # After the image, so the tag exists only once the image it names is actually
      # published.
      - name: Tag the released version
        id: tag
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPO}/git/refs" \
            -f "ref=refs/tags/web-v${VERSION}" \
            -f "sha=${SHA}"
          echo "Released web-v${VERSION}."

      # Always, so a failed run says how far it got.
      - name: Summarize the release
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.version.outputs.image }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Release web"
            echo
            if [ "$VERSION_OUTCOME" != "success" ]; then
              echo "- **Version:** not worked out (${VERSION_OUTCOME:-skipped})"
            elif [ -n "$VERSION" ]; then
              echo "- **Version:** \`${VERSION}\`"
            else
              echo "- **Version:** no version earned"
            fi
            echo "- **Image:** \`${IMAGE:-not worked out}\`"
            echo "- **Digest:** \`${DIGEST:-not published}\` (${BUILD_OUTCOME:-skipped})"
            if [ -n "$VERSION" ]; then
              echo "- **Tag \`web-v${VERSION}\`:** ${TAG_OUTCOME:-skipped}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Only after a release that earned a version, which means the tag exists, so :dev only
  # ever points at a digest that also carries a released :<version>.
  dev:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: dev
      url: https://campfire.wsj27.scouterna.net
    # Scoped to the job that needs it, which moves the image tag.
    permissions:
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # It copies the manifest by digest – nothing is built, pulled, or pushed but the
      # tag.
      - name: Move dev to the released version
        id: dev
        env:
          DIGEST: ${{ needs.release.outputs.digest }}
          IMAGE: ${{ needs.release.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:dev" "${IMAGE}@${DIGEST}"
          echo "Moved ${IMAGE}:dev to ${DIGEST}."

      # Always, so a failed move says so. Re-running this failed job moves :dev with the
      # release's outputs, but a new run of the workflow does not – the tag exists, so it
      # earns no version and skips this job – so the summary also gives the command that
      # moves it by hand.
      - name: Summarize the move
        if: always()
        env:
          DEV_OUTCOME: ${{ steps.dev.outcome }}
          DIGEST: ${{ needs.release.outputs.digest }}
          IMAGE: ${{ needs.release.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## Move dev"
            echo
            echo "- **\`:dev\`:** ${DEV_OUTCOME:-skipped}"
            if [ "$DEV_OUTCOME" != "success" ]; then
              echo
              echo "\`web-v${VERSION}\` exists but \`:dev\` did not move. Re-run this failed job – a new run of the workflow earns no version and will not move it – or move it by hand:"
              echo
              echo "\`\`\`sh"
              echo "docker buildx imagetools create --tag ${IMAGE}:dev ${IMAGE}@${DIGEST}"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
