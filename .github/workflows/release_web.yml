name: Release web

# Packages the web application as a container image and publishes it to the GitHub
# Container Registry, so a deployment has something to pull. Nothing here deploys –
# the dev cluster takes the image by hand (ADR 027), and this workflow assumes no host.
#
# The version in package.json is the source of truth, the same way metadata.version is
# for a skill: the tag is web-v<version>, so bumping the version cuts a release and an
# unchanged version is skipped. CalVer, per the Versioning section of AGENTS.md.
#
# Every merge also publishes :main and :sha-<short>, whether or not the version moved.
# Those are for rollback and for pointing a staging deployment at a specific commit;
# the version tags are what a real deployment pins.
#
# Also runnable by hand, to retry a release that failed.

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "modules/**"
      - "libraries/**"
      - "config/vite/**"
      - "config/environments/prod/Dockerfile"
      - "config/environments/prod/image.Caddyfile"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".tool-versions"
      - ".dockerignore"
      - ".github/workflows/release_web.yml"
  workflow_dispatch:

# Releases queue rather than race: two merges in quick succession would otherwise
# create the same tag twice. Never cancel one in flight – a canceled release can
# leave a tag without its image, or an image without its tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    # An amd64 runner, because the image is built for amd64 and only for amd64 – the
    # cluster's platform (ADR 026). The Dockerfile's build stage runs on the runner's own
    # platform whatever the target, so nothing here runs under emulation either way.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Scoped to the job that needs it: packages to publish the image, contents to
    # create the version tag.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Work out the version and the tags
        id: version
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"

          # A registry path is lowercase; a GitHub owner is not necessarily.
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # Always published, version or not: a moving pointer at main, and an
          # immutable one at this exact commit.
          tags="${image}:main
          ${image}:sha-$(printf '%s' "$SHA" | cut -c1-7)"

          # The version's tag is its identity, and what says whether it has shipped.
          # To re-release a version, delete its tag.
          git_tag="web-v${version}"
          if git ls-remote --exit-code origin "refs/tags/${git_tag}" >/dev/null 2>&1; then
            echo "Version $version is already released as $git_tag – publishing main and sha tags only."
            release=false
          else
            tags="${tags}
          ${image}:${version}
          ${image}:latest"
            release=true
          fi

          {
            echo "release=${release}"
            echo "version=${version}"
            echo "git_tag=${git_tag}"
            echo "tags<<EOF"
            printf '%s\n' "$tags" | sed 's/^[[:space:]]*//'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The install layer is the expensive one, and the Dockerfile is laid out so a
      # source change reuses it. The cache carries that across runs, where a runner
      # starts with nothing.
      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: config/environments/prod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so the tag exists only once the image it names is actually published.
      - name: Tag the released version
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPO}/git/refs" \
            -f "ref=refs/tags/${GIT_TAG}" \
            -f "sha=${SHA}"
          echo "Released ${GIT_TAG}."
