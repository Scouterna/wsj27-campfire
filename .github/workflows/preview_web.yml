name: Preview web

# Builds the web image from the dev branch and publishes it as :dev, which the dev site
# runs (ADR 038). The dev branch holds work that may never ship, so nothing here works
# out a version, creates a tag, or touches :staging or :prod – those belong to
# release_web.yml and promote_web.yml.
#
# Every push builds, whatever it touched and force-pushes included, because the branch
# is recreated from main whenever it drifts and each recreation has to reach the site.
#
# The job runs in the dev environment, so every move of :dev is a deployment linking to
# the site it serves. Nothing here deploys either – how the cluster notices a moved tag
# is settled with the people who run it.

on:
  push:
    branches:
      - dev

# A newer push makes the build in flight worthless, so it is canceled rather than left
# to finish after the newer one and move :dev back. A canceled build publishes nothing,
# because the tag is pushed only once the image is complete.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  preview:
    # An amd64 runner, for the same reason as release_web.yml – the image is built for the
    # cluster's platform only, and the build stage runs natively.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: dev
      url: https://campfire.wsj27.scouterna.net
    # Scoped to the job that needs it, which publishes the image.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Work out the image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A registry path is lowercase; a GitHub owner is not necessarily.
          echo "image=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # No version is passed, so the image says 0.0.0 – what the dev site runs is not a
      # release. It reads the cache the releases on main write, so the install layer is
      # reused, and writes none of its own, because a branch that is thrown away
      # would only crowd main's out of the cache.
      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: config/environments/prod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}:dev
          cache-from: type=gha

      # Always, so a failed run says how far it got.
      - name: Summarize the preview
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "## Preview web"
            echo
            echo "- **Commit:** \`${SHA}\`"
            echo "- **Image:** \`${IMAGE:-not worked out}:dev\`"
            echo "- **Digest:** \`${DIGEST:-not published}\` (${BUILD_OUTCOME:-skipped})"
          } >> "$GITHUB_STEP_SUMMARY"
