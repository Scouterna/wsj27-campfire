# The prod environment's containers: Caddy as the front door, the real wsj27-auth-api
# against the real ScoutID, and the deployable image serving the web – so what runs is
# the artifact that would be deployed rather than a dev server standing in for it.
# Serves http://localhost:8000, like every other environment.
#
# `pnpm start:prod` generates the signing key the auth service reads and brings this up;
# the credentials in the .env beside this file are yours to write. The dev environment
# has its own copy of this file, differing only in what serves the web – duplicated on
# purpose, so each environment can be read on its own.
services:
  ingress:
    image: caddy:2-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # No depends_on: it orders starts, not readiness. Caddy answers 502 until its
    # back-end is up, and the start script waits for a status the back-end itself
    # produced before it reports the environment ready.

  # The real auth service, built from its repository's main – the one exception to
  # pinning every dependency (ADR 005). The back-end services are part of this system
  # rather than dependencies held at arm's length: what they ship is what the application
  # is meant to work against, so an environment takes whatever main holds. The stack comes
  # up with `--build`, so the ref is resolved fresh every start.
  auth:
    build:
      context: https://github.com/Scouterna/wsj27-auth-api.git#main
    # The credentials come from the gitignored .env beside this file, which you write and
    # nothing overwrites: OIDC_SERVER, OIDC_CLIENT_ID, and OIDC_CLIENT_SECRET. Everything
    # else is the same on every machine, so it is here where it can be read rather than in
    # a generated file.
    env_file:
      - .env
    environment:
      PORT: 8000
      # The address the *browser* reaches the service on – through the ingress, never the
      # container directly – so the Keycloak callback and every cookie land on the one
      # origin the whole stack shares.
      PUBLIC_URL: http://localhost:8000/api/auth
      ALLOWED_REDIRECT_DOMAINS: localhost:8000
      # Generated on first run and exported by the start script, which is why compose is
      # not the way to bring these containers up by hand.
      SIGNING_KEY: ${CAMPFIRE_SIGNING_KEY:?start this with pnpm start:dev or pnpm start:prod}
      # Local only: the stack is plain http.
      INSECURE_COOKIES: "true"
      # Where the roles this service mints come from. The SERVICE_CLIENT_ROLES entry
      # is what authorizes the call: the service mints its own token as wsj27-auth,
      # so there is no secret to configure.
      PROJECT_API_URL: http://ingress:8001
      SERVICE_CLIENT_ROLES: '{"wsj27-auth": ["wsj27:bulkread"]}'

  # The real project API, built from its repository's main like the auth service
  # above. It verifies a token by fetching the JWKS at the auth service's
  # public URL, http://localhost:8000/api/auth/certs – an address that reaches the front
  # door only from inside the ingress's own network namespace, which is why this
  # container shares it instead of getting its own. The ingress reaches it as
  # localhost:8001, and the auth service as ingress:8001.
  project:
    build:
      context: https://github.com/Scouterna/wsj27-project-api.git#main
    network_mode: service:ingress
    environment:
      # 8001, because the ingress already holds 8000 in the shared namespace.
      PORT: 8001
      # Explicit, with the trailing slash its URL joining needs: the derived default
      # builds the discovery URL from the incoming request and lands outside /api/auth.
      OIDC_SERVER_PATH: http://localhost:8000/api/auth/
      # The Scoutnet credentials live in the gitignored .env beside this file, with
      # the Keycloak client's. Without them the service runs and serves nobody.
      SCOUTNET_PROJECTS: "${SCOUTNET_PROJECTS:-[]}"
      SCOUTNET_BODYLIST_KEY: "${SCOUTNET_BODYLIST_KEY:-}"
      # The CMT roster that splits wsj27:cmt into wsj27:cmt:<funktion>:<roll>. The
      # file is gitignored – real people – and the service logs a warning and keeps
      # the plain role when the mount holds nothing.
      CMT_ROLES_FILE: /app/cmt-roles.csv
      # No POSTGRES_DSN: the /cases feature stays off, and everything else works.
    volumes:
      # The fetched Scoutnet data survives a restart, so the service can start from
      # its disk cache when Scoutnet is slow or unreachable.
      - project_persist:/app/persist
      # On a machine without the roster Docker mounts an empty directory in its
      # place, which the service reads as the file being absent.
      - ./cmt-roles.csv:/app/cmt-roles.csv:ro

  # The image `pnpm build:image` produced, serving the built files on 8080 through its
  # own Caddy. Never built here: what runs must be the artifact that was tested, so a
  # missing image is an error from the start script rather than a fresh build.
  web:
    image: wsj27-campfire
    # The image is amd64 – the cluster's platform – so on an Apple-silicon machine this
    # runs it under emulation on purpose, rather than failing on the mismatch.
    platform: linux/amd64

volumes:
  project_persist:
