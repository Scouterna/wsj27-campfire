name: Campfire

# The readable source for the Xcode project. `pnpm generate:apple` runs XcodeGen over
# this file and the result, Campfire.xcodeproj, is committed – so a fresh clone can build
# and run with Xcode alone, and XcodeGen is a prerequisite for changing the project
# rather than for using it.
options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true
  indentWidth: 2
  tabWidth: 2
  deploymentTarget:
    iOS: 26.0
  defaultConfig: Local (Debug)
  groupSortPosition: top

attributes:
  BuildIndependentTargetsInParallel: true

# The environments differ in one setting, the origin the shell loads the web application
# from, which each environment's xcconfig sets. A configuration is an environment crossed
# with a build type, and XcodeGen's configVariants turn them into one scheme per
# environment.
configs:
  Local (Debug): debug
  Local (Release): release
  Dev (Debug): debug
  Dev (Release): release
  Prod (Debug): debug
  Prod (Release): release

configFiles:
  Local (Debug): config/Local.xcconfig
  Local (Release): config/Local.xcconfig
  Dev (Debug): config/Dev.xcconfig
  Dev (Release): config/Dev.xcconfig
  Prod (Debug): config/Prod.xcconfig
  Prod (Release): config/Prod.xcconfig

settings:
  # No target links AppIntents.framework, so Xcode's metadata processor has nothing to
  # extract and says so once per target on every build. Telling it not to look is the only
  # way to stop it, and it also hides from the system any App Intent a target adds.
  LM_SKIP_METADATA_EXTRACTION: YES
  DEAD_CODE_STRIPPING: true
  ENABLE_USER_SCRIPT_SANDBOXING: true
  SWIFT_VERSION: 6

fileGroups:
  - config
  - project.yml

targets:
  Campfire:
    type: application
    # iOS only. This bounds the platform and TARGETED_DEVICE_FAMILY bounds the device,
    # because an iOS destination alone still produces an iPad build.
    supportedDestinations: [iOS]

    sources:
      - path: assets
        buildPhase: resources
      - path: src
        buildPhase: sources
        createIntermediateGroups: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAMPFIRE_BUNDLE_ID)
        PRODUCT_NAME: $(CAMPFIRE_APP_NAME)
        # iPhone alone, because the phone-width web application is not laid out for an
        # iPad.
        TARGETED_DEVICE_FAMILY: "1"
        # Automatic signing with a real team, so the shell can run on a device. A
        # Simulator build never signs, so this costs the Simulator path nothing.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(CAMPFIRE_DEVELOPMENT_TEAM)

    info:
      path: config/generated/Campfire.plist
      properties:
        CFBundleDevelopmentRegion: sv
        CFBundleName: $(CAMPFIRE_APP_NAME)
        CFBundleDisplayName: $(CAMPFIRE_APP_NAME)
        CFBundleShortVersionString: $(CAMPFIRE_VERSION_NUMBER)
        CFBundleVersion: $(CAMPFIRE_BUILD_NUMBER)

        # Read by Config.swift, and the one place the address of the web application
        # appears.
        Campfire:
          WebOrigin: $(CAMPFIRE_WEB_ORIGIN)

        # The development server speaks cleartext, which App Transport Security refuses
        # by default, so it is permitted for local addresses and nothing else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

        # The window the system shows while the process starts, in the icon's tonal
        # blue.
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

    scheme:
      # One scheme per environment, each bound to that environment's pair of
      # configurations. Prod leads so that a fresh checkout opens on it in Xcode's scheme
      # menu, and the scripts name the scheme they want rather than rely on the
      # selection.
      configVariants:
        - Prod
        - Dev
        - Local
      testTargets:
        - name: CampfireTests
          parallelizable: true
        - name: CampfireUITests

  # Swift Testing, hosted by the app so that Config can read the same Info.plist the
  # shell reads.
  CampfireTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: test
        buildPhase: sources
        createIntermediateGroups: true
    dependencies:
      - target: Campfire
    settings:
      base:
        CODE_SIGNING_ALLOWED: false
        PRODUCT_BUNDLE_IDENTIFIER: $(CAMPFIRE_BUNDLE_ID).tests
        BUNDLE_LOADER: $(TEST_HOST)
        "TEST_HOST[sdk=iphonesimulator*]": $(BUILT_PRODUCTS_DIR)/$(CAMPFIRE_APP_NAME).app/$(CAMPFIRE_APP_NAME)
    info:
      path: config/generated/Campfire-test.plist
      properties:
        CFBundleDevelopmentRegion: sv
        CFBundleName: CampfireTests
        CFBundleShortVersionString: $(CAMPFIRE_VERSION_NUMBER)
        CFBundleVersion: $(CAMPFIRE_BUILD_NUMBER)

  # XCUITest, driving the real shell.
  CampfireUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: test-ui
        buildPhase: sources
        createIntermediateGroups: true
    dependencies:
      - target: Campfire
    settings:
      base:
        CODE_SIGNING_ALLOWED: false
        PRODUCT_BUNDLE_IDENTIFIER: $(CAMPFIRE_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Campfire
    info:
      path: config/generated/Campfire-uitest.plist
      properties:
        CFBundleDevelopmentRegion: sv
        CFBundleName: CampfireUITests
        CFBundleVersion: $(CAMPFIRE_BUILD_NUMBER)
