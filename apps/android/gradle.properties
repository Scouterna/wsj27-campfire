org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:HeapDumpPath=.build/tmp
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle reuses the configured task graph rather than rebuilding it every run, which
# every task the root scripts invoke supports.
org.gradle.configuration-cache=true

# The IDE's sync fetches the projects' models in parallel rather than one at a time,
# which needs Gradle 9.4 or later.
org.gradle.tooling.parallel=true
