org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:HeapDumpPath=.build/tmp
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle reuses the configured task graph rather than rebuilding it every run.
# Verified against every task this repository invokes – assemble, ktlint, Detekt,
# Android Lint, the unit tests, and the instrumented compile – with no problems
# stored.
org.gradle.configuration-cache=true

# The IDE's sync fetches the projects' models in parallel rather than one at a time.
# Understood by Gradle 9.4 and later, which the wrapper's version satisfies.
org.gradle.tooling.parallel=true
